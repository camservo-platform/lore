[project]
name = "lore"
version = "0.1.0"
description = "Voice-driven tabletop RPG Game Master: game state and lore MCP servers"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.8.0",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "mcp==2.2.0",
    "pgvector>=0.5.0",
    "redis>=8.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
