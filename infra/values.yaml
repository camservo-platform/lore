# Site configuration for the Lore backing services.
# Apply changes with: ./deploy.sh
#
# Hosted (not in the cluster): Deepgram (voice) and the LLM provider.
# In the cluster: PostgreSQL + pgvector (game state, event log, lore vectors), Redis
# (live event streams, multi-user session data), a CPU-only Ollama serving the
# embedding model, and the MCP servers.
#
# Site-specific settings (hostname, ingress annotations) go in values.local.yaml,
# which is gitignored and layered on top of this file by deploy.sh.

# Secret holding all credentials. deploy.sh creates it if missing. Keys:
#   postgres-password   password for the app user (postgres.user)       generated
#   redis-password      required by Redis (AUTH)                         generated
#   deepgram-api-key    from DEEPGRAM_API_KEY in secrets.env, or ./deploy.sh set-key
#   llm-api-key         from LLM_API_KEY in secrets.env, or ./deploy.sh set-key
credentialsSecret: lore-credentials

# htpasswd-format users allowed through the ingress (./deploy.sh add-user <name>).
usersSecret: lore-users

# Hosted LLM used for world generation and the Game Master itself. Only exposed to the app
# through the lore-config ConfigMap; nothing in this chart calls it.
llm:
  provider: anthropic
  model: claude-opus-5-5
  # Used for turns taken in speech mode, where waiting is most noticeable. The table
  # can switch between modes freely; world generation and text turns use `model`.
  speechModel: claude-sonnet-5-5
  # Thinking depth per Game Master turn: low | medium | high. Lower answers faster,
  # which matters most in speech mode.
  effort: medium

deepgram:
  # Deepgram models the app should use; exposed via lore-config.
  # Live conversation uses Deepgram Flux (turn detection and interruptions); it must be a
  # Flux model: flux-general-en, or flux-general-multi for other languages.
  sttModel: flux-general-en
  # Default Game Master voice; players can pick another in the UI.
  ttsModel: aura-2-pandora-en

postgres:
  # Official postgres image plus the pgvector extension (enabled by the app's migrations).
  image: pgvector/pgvector:0.8.6-pg18
  database: lore
  user: lore
  # local-path volumes pin the pod to whichever node it first lands on; use
  # nodeSelector to choose a reliable node for game state.
  nodeSelector: {}
  tolerations: []
  persistence:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Appended to postgresql.conf via command-line flags; tuned for a Pi.
  config:
    shared_buffers: 128MB
    effective_cache_size: 384MB
    work_mem: 4MB
    max_connections: "50"

redis:
  image: redis:8.8.3
  # Session data should expire rather than be evicted: only keys with a TTL are
  # evicted when full. Event streams are capped by the app instead.
  maxmemory: 192mb
  maxmemoryPolicy: volatile-lru
  nodeSelector: {}
  tolerations: []
  persistence:
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# CPU embedding server (Ollama API on :11434). Set enabled: false and point
# embeddings.url at another endpoint (e.g. http://ollama.ollama:11434) to reuse
# the GPU Ollama instead.
embeddings:
  enabled: true
  image: ollama/ollama:0.34.4
  # Pulled into the model volume by an init container on every start (no-op once cached).
  # nomic-embed-text: 768-dim vectors, ~270MB, fine on a Pi CPU.
  # Changing the model means a new migration (vector column size) and re-embedding all lore.
  model: nomic-embed-text
  dimensions: 768
  # nomic-embed-text expects task prefixes; set both to "" for models that don't.
  documentPrefix: "search_document: "
  queryPrefix: "search_query: "
  # Only used when enabled: false.
  url: ""
  nodeSelector: {}
  tolerations: []
  persistence:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi

# The Python app image (built by .github/workflows/app.yml). deploy.sh sets the
# tag to the last commit that touched app/.
app:
  image: ghcr.io/camservo-platform/lore
  tag: latest
  imagePullSecrets: []

# MCP servers (stateless streamable HTTP; scale with replicas). Each pod runs the
# database migrations in an init container first.
mcp:
  servers:
    game:
      module: lore.mcp.game
      path: /mcp/game
      replicas: 1
    lore:
      module: lore.mcp.lore
      path: /mcp/lore
      replicas: 1
  # Time for Traefik and the web pods to stop sending requests to an old pod on deploy.
  preStopSeconds: 5
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# The web table (UI + Game Master). Turns are serialised per campaign through Redis,
# so replicas can be added freely.
web:
  replicas: 1
  # Lore names allowed into the admin view, which can run SQL against the game database
  # and search the lore vectors directly. Set in values.local.yaml.
  admins: []
  # GitHub sign-in: GitHub login -> Lore name, e.g. {octocat: alice}. Only listed
  # accounts may sign in. The OAuth app's client id and secret go in secrets.env
  # (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET); its callback URL is
  # https://<ingress.host>/auth/github/callback. Passwords (./deploy.sh add-user) keep
  # working alongside it. Set in values.local.yaml.
  githubUsers: {}
  # Deploys don't cut players off: the old pod drains while the new one takes new
  # connections. Live feeds and idle voice sessions reconnect to the new pod at once (and
  # resume without missing anything); GM turns and world forging in progress finish
  # first. Whatever is still running after `seconds` is cancelled cleanly (history saved,
  # table unlocked). `./deploy.sh deploy --now` (or `./deploy.sh hurry` while a drain is
  # running) skips the wait. The pod's termination grace is preStopSeconds + seconds + 20.
  drain:
    # Time for Traefik to stop routing new requests to the old pod before it drains.
    preStopSeconds: 5
    seconds: 240
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# Public HTTPS entry point, protected by Traefik basic auth. Disabled until a host
# is set (in values.local.yaml). The authenticated username reaches the app as the
# X-Lore-User header and is recorded as the actor in the event log.
ingress:
  host: ""
  className: traefik
  # e.g. cert-manager.io/cluster-issuer, external-dns targets
  annotations: {}
  tlsSecretName: lore-tls

# Prometheus metrics (web app, port 9100), alert rules and a Grafana dashboard. Needs the
# Prometheus Operator CRDs (kube-prometheus-stack) and Grafana's dashboard sidecar.
monitoring:
  enabled: true
  namespace: monitoring   # where Prometheus runs (allowed to scrape port 9100)
  interval: 30s
  grafanaDashboard: true

# Restrict the data services to clients in this namespace, and the MCP servers to
# this namespace plus the ingress controller (kubectl port-forward still works).
# Same for the web UI.
networkPolicy:
  enabled: true
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
