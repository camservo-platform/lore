{{- $ctx := dict "ctx" . "component" "web" }}
{{- $v := .Values.web }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lore.fullname" . }}-web
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "lore.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lore.fullname" . }}-web
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  # Start the new pod and wait for it to be ready before retiring an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "lore.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lore.selectorLabels" $ctx | nindent 8 }}
        lore/public: "true"
      annotations:
        # Restart when the shared config changes: envFrom is only read at startup.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      {{- include "lore.scheduling" $v | nindent 6 }}
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      # The old pod drains (see lore/web/drain.py): preStop, then turns get up to
      # drain.seconds to finish, then a margin for cancelled ones to save and exit.
      terminationGracePeriodSeconds: {{ add $v.drain.preStopSeconds $v.drain.seconds 20 }}
      containers:
        - name: web
          image: {{ include "lore.image" . }}
          command: ["python", "-m", "lore.web"]
          lifecycle:
            preStop:
              # Lets Traefik stop routing new requests here before the drain starts.
              exec:
                command: ["sleep", "{{ $v.drain.preStopSeconds }}"]
          envFrom:
            - configMapRef:
                name: {{ include "lore.fullname" . }}-config
          env:
            # The admin view queries Postgres directly.
            {{- include "lore.secretEnv" (list . "PGPASSWORD" "postgres-password") | nindent 12 }}
            {{- include "lore.secretEnv" (list . "REDIS_PASSWORD" "redis-password") | nindent 12 }}
            {{- include "lore.secretEnv" (list . "LLM_API_KEY" "llm-api-key") | nindent 12 }}
            # Behind Traefik: trust its X-Forwarded-Proto so the app knows requests are HTTPS.
            # Only the ingress controller (and this namespace) can reach the pod.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            - name: LORE_METRICS_PORT
              value: "9100"
            - name: LORE_PASSWORDS_FILE
              value: /etc/lore/users/users
            {{- range $env, $key := dict "GITHUB_CLIENT_ID" "github-client-id" "GITHUB_CLIENT_SECRET" "github-client-secret" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.credentialsSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            # Optional: without it the UI offers text mode only.
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: deepgram-api-key
                  optional: true
            - name: LORE_DRAIN_SECONDS
              value: {{ $v.drain.seconds | quote }}
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # The password logins (htpasswd); updates reach the pod within about a minute.
            - name: users
              mountPath: /etc/lore/users
              readOnly: true
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        - name: users
          secret:
            secretName: {{ .Values.usersSecret }}
