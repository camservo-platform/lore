{{- $ctx := dict "ctx" . "component" "config" }}
# Non-secret connection settings for the app and MCP servers. Use with
#   envFrom: [{configMapRef: {name: lore-config}}]
# plus secretKeyRef entries from the credentials secret for passwords and keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lore.fullname" . }}-config
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
data:
  LORE_CREDENTIALS_SECRET: {{ .Values.credentialsSecret | quote }}
  PGHOST: {{ include "lore.postgresHost" . | quote }}
  PGPORT: "5432"
  PGDATABASE: {{ .Values.postgres.database | quote }}
  PGUSER: {{ .Values.postgres.user | quote }}
  REDIS_HOST: {{ include "lore.redisHost" . | quote }}
  REDIS_PORT: "6379"
  EMBEDDINGS_URL: {{ include "lore.embeddingsUrl" . | quote }}
  EMBEDDINGS_MODEL: {{ .Values.embeddings.model | quote }}
  EMBEDDINGS_DIMENSIONS: {{ .Values.embeddings.dimensions | quote }}
  EMBEDDINGS_DOCUMENT_PREFIX: {{ .Values.embeddings.documentPrefix | quote }}
  EMBEDDINGS_QUERY_PREFIX: {{ .Values.embeddings.queryPrefix | quote }}
  {{- range $name, $_ := .Values.mcp.servers }}
  MCP_{{ upper $name }}_URL: {{ include "lore.mcpUrl" (list $ $name) | quote }}
  {{- end }}
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  LLM_SPEECH_MODEL: {{ .Values.llm.speechModel | quote }}
  LLM_EFFORT: {{ .Values.llm.effort | quote }}
  LORE_ADMINS: {{ join "," .Values.web.admins | quote }}
  DEEPGRAM_STT_MODEL: {{ .Values.deepgram.sttModel | quote }}
  DEEPGRAM_TTS_MODEL: {{ .Values.deepgram.ttsModel | quote }}
