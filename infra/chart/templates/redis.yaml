{{- $ctx := dict "ctx" . "component" "redis" }}
{{- $v := .Values.redis }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lore.fullname" . }}-redis
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "lore.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lore.fullname" . }}-redis
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "lore.fullname" . }}-redis
  selector:
    matchLabels:
      {{- include "lore.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lore.selectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "lore.scheduling" $v | nindent 6 }}
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: {{ $v.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            # Append-only file, fsync every second: at most ~1s of writes lost on a crash.
            - --appendonly
            - "yes"
            - --maxmemory
            - {{ $v.maxmemory | quote }}
            - --maxmemory-policy
            - {{ $v.maxmemoryPolicy | quote }}
          env:
            {{- include "lore.secretEnv" (list . "REDIS_PASSWORD" "redis-password") | nindent 12 }}
            # Lets redis-cli in the container authenticate (./deploy.sh redis).
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
