{{- with .Values.ingress }}
{{- if .host }}
{{- $ctx := dict "ctx" $ "component" "ingress" }}
# The web app signs players in itself (GitHub or password, see lore/web/auth.py), so its
# route has no proxy auth. This Ingress owns the TLS certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lore.fullname" $ }}
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .className }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lore.fullname" $ }}-web
                port:
                  name: http
  tls:
    - hosts:
        - {{ .host }}
      secretName: {{ .tlsSecretName }}
---
# MCP clients (e.g. Claude Code) keep Traefik basic auth: it replaces any client-sent
# X-Lore-User with the authenticated username, which the MCP servers record as the actor.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "lore.fullname" $ }}-auth
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  basicAuth:
    secret: {{ $.Values.usersSecret }}
    realm: lore
    headerField: X-Lore-User
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lore.fullname" $ }}-mcp
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ include "lore.fullname" $ }}-auth@kubernetescrd
    {{- range $key, $value := .annotations }}
    {{- if not (hasPrefix "cert-manager.io/" $key) }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .className }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          {{- range $name, $server := $.Values.mcp.servers }}
          - path: {{ $server.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "lore.fullname" $ }}-mcp-{{ $name }}
                port:
                  name: http
          {{- end }}
  tls:
    - hosts:
        - {{ .host }}
      secretName: {{ .tlsSecretName }}
{{- end }}
{{- end }}
