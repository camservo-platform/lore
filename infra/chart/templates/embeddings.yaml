{{- if .Values.embeddings.enabled }}
{{- $ctx := dict "ctx" . "component" "embeddings" }}
{{- $v := .Values.embeddings }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lore.fullname" . }}-embeddings
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "lore.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
---
# StatefulSet rather than Deployment only for the volumeClaimTemplate: the model
# cache lives on a local-path volume and survives restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lore.fullname" . }}-embeddings
  labels:
    {{- include "lore.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "lore.fullname" . }}-embeddings
  selector:
    matchLabels:
      {{- include "lore.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lore.selectorLabels" $ctx | nindent 8 }}
      annotations:
        lore/model: {{ $v.model | quote }}
    spec:
      {{- include "lore.scheduling" $v | nindent 6 }}
      initContainers:
        # Start a throwaway server, pull the model into the shared volume, exit.
        - name: pull-model
          image: {{ $v.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              ollama serve >/dev/null 2>&1 &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$MODEL"
          env:
            - name: MODEL
              value: {{ $v.model | quote }}
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ollama
          image: {{ $v.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            # Keep the embedding model resident; reloading it costs seconds on a Pi.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
{{- end }}
